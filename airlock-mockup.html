<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Airlock Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
  }
  @keyframes hover {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }
  .floating { animation: hover 3.2s ease-in-out infinite; transform-origin: center; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

function Captain() {
  return (
    <svg
      className="floating"
      width="188" height="192" viewBox="0 0 220 240"
      style={{ display: "block", margin: "0 auto" }}
      aria-hidden="true"
    >
      <g fill="#D1D1D6">
        <rect x="78"  y="188" width="26" height="40" rx="13" />
        <rect x="116" y="188" width="26" height="40" rx="13" />
        <rect x="62" y="118" width="96" height="92" rx="34" />
        <circle cx="110" cy="74" r="62" />
      </g>
    </svg>
  );
}

function IconTile({ children, background }) {
  return (
    <div style={{
      width: 32, height: 32, borderRadius: 8,
      background, display: "flex", alignItems: "center", justifyContent: "center",
      flexShrink: 0, overflow: "hidden", position: "relative",
    }}>
      {children}
    </div>
  );
}

function InstagramIcon() {
  return (
    <IconTile background="linear-gradient(135deg, #833AB4 0%, #E1306C 50%, #F77737 100%)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5" />
        <circle cx="12" cy="12" r="4" />
        <circle cx="17.5" cy="6.5" r="1" fill="#fff" stroke="none" />
      </svg>
    </IconTile>
  );
}

function TikTokIcon() {
  const Note = ({ fill, dx = 0 }) => (
    <svg
      width="18" height="18" viewBox="0 0 24 24"
      style={{ position: "absolute", left: `calc(50% - 9px + ${dx}px)`, top: "calc(50% - 9px)" }}
      aria-hidden="true"
    >
      <path
        d="M14.5 3.5 V14.2 a3.3 3.3 0 1 1 -3.3 -3.3 c.3 0 .6 0 .9 .1 V7.6 a6.6 6.6 0 1 0 5.6 6.6 V8.7 a5.8 5.8 0 0 0 3.3 1 V6.6 a3.3 3.3 0 0 1 -3.3 -3.1 z"
        fill={fill}
      />
    </svg>
  );
  return (
    <IconTile background="#000">
      <Note fill="#69C9D0" dx={-1.5} />
      <Note fill="#EE1D52" dx={1.5} />
      <Note fill="#FFFFFF" dx={0} />
    </IconTile>
  );
}

function XIcon() {
  return (
    <IconTile background="#000">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 3 L21 21 M21 3 L3 21" stroke="#fff" strokeWidth="2.6" strokeLinecap="square" />
      </svg>
    </IconTile>
  );
}

function AppRow({ icon, name, sessions, first }) {
  return (
    <div style={{
      height: 48, display: "flex", alignItems: "center", gap: 14,
      borderTop: first ? "none" : "0.5px solid #F2F2F7",
    }}>
      {icon}
      <div style={{ flex: 1, color: "#111111", fontSize: 16, fontWeight: 400, letterSpacing: -0.1 }}>
        {name}
      </div>
      <div style={{ color: "#AEAEB2", fontSize: 14, fontWeight: 400 }}>
        {sessions} sessions
      </div>
    </div>
  );
}

function AddPlatformRow() {
  return (
    <div style={{ height: 48, display: "flex", alignItems: "center", gap: 14, borderTop: "0.5px solid #F2F2F7" }}>
      <div style={{
        width: 32, height: 32, borderRadius: 16, border: "1.2px dashed #D1D1D6",
        display: "flex", alignItems: "center", justifyContent: "center", color: "#AEAEB2",
        flexShrink: 0,
      }}>
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
          <path d="M7 1.5 V12.5 M1.5 7 H12.5" stroke="#AEAEB2" strokeWidth="1.4" strokeLinecap="round" />
        </svg>
      </div>
      <div style={{ flex: 1, color: "#AEAEB2", fontSize: 16, fontWeight: 400 }}>Add a platform</div>
    </div>
  );
}

function TabBar({ active = "home" }) {
  const Item = ({ id, label, children }) => {
    const isActive = id === active;
    const color = isActive ? "#A8243C" : "#8E8E93";
    return (
      <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
        <div style={{ color, height: 22, display: "flex", alignItems: "center" }}>{children}</div>
        <div style={{ color, fontSize: 11, fontWeight: 500 }}>{label}</div>
      </div>
    );
  };

  return (
    <div style={{
      display: "flex", alignItems: "flex-start", justifyContent: "space-between",
      padding: "12px 8px 6px", borderTop: "0.5px solid #F2F2F7",
      background: "#FFFFFF",
    }}>
      <Item id="home" label="Home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M3 11 L12 3 L21 11 V20 a1 1 0 0 1 -1 1 H15 V14 H9 V21 H4 a1 1 0 0 1 -1 -1 z" />
        </svg>
      </Item>
      <Item id="stats" label="Stats">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" aria-hidden="true">
          <rect x="3"  y="13" width="3.5" height="7" rx="1" />
          <rect x="10" y="9"  width="3.5" height="11" rx="1" />
          <rect x="17" y="5"  width="3.5" height="15" rx="1" />
        </svg>
      </Item>
      <Item id="history" label="History">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7 V12 L15.5 14" />
        </svg>
      </Item>
      <Item id="settings" label="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.5" />
          <path d="M12 2 V5 M12 19 V22 M4.2 4.2 L6.3 6.3 M17.7 17.7 L19.8 19.8 M2 12 H5 M19 12 H22 M4.2 19.8 L6.3 17.7 M17.7 6.3 L19.8 4.2" />
        </svg>
      </Item>
    </div>
  );
}

function Airlock() {
  return (
    <IOSDevice width={390} height={844}>
      <div style={{
        height: "100%", background: "#FFFFFF",
        display: "flex", flexDirection: "column",
        fontFamily: '-apple-system, "SF Pro Text", "Inter", system-ui, sans-serif',
        color: "#111111",
      }}>
        <div style={{ flex: 1, overflowY: "auto", overflowX: "hidden", padding: "80px 18px 0", display: "flex", flexDirection: "column" }}>
          <Captain />

          <div style={{
            textAlign: "center", marginTop: 8,
            color: "#3C3C43", fontSize: 15, fontWeight: 400, letterSpacing: -0.1,
          }}>
            The Captain is suiting up.
          </div>

          <div style={{ textAlign: "center", marginTop: 8 }}>
            <div style={{ fontSize: 40, fontWeight: 700, color: "#111111", letterSpacing: -1.0, lineHeight: 1 }}>
              7.2
            </div>
            <div style={{ marginTop: 2, color: "#8E8E93", fontSize: 13, fontWeight: 400 }}>
              pretty solid
            </div>
          </div>

          <div style={{ marginTop: 16, height: 4, borderRadius: 2, background: "#F2F2F7", overflow: "hidden" }}>
            <div style={{ width: "72%", height: "100%", background: "#A8243C", borderRadius: 2 }} />
          </div>

          <div style={{
            marginTop: 10, display: "flex", alignItems: "center", justifyContent: "center", gap: 18,
            fontSize: 15, color: "#3C3C43",
          }}>
            <div><span style={{ fontWeight: 700, color: "#111", fontSize: 18 }}>3</span> <span style={{ color: "#8E8E93", fontSize: 14 }}>sessions today</span></div>
            <div style={{ width: 1, height: 16, background: "#E5E5EA" }} />
            <div><span style={{ fontWeight: 700, color: "#111", fontSize: 18 }}>47m</span> <span style={{ color: "#8E8E93", fontSize: 14 }}>total time</span></div>
          </div>

          <div style={{ marginTop: 22, marginBottom: 2, fontSize: 12, fontWeight: 500, color: "#AEAEB2" }}>
            Your platforms
          </div>

          <AppRow first icon={<InstagramIcon />} name="Instagram" sessions={8} />
          <AppRow icon={<TikTokIcon />} name="TikTok" sessions={5} />
          <AppRow icon={<XIcon />} name="X" sessions={12} />
          <AddPlatformRow />

          <div style={{ marginTop: "auto", marginBottom: 10, display: "flex", justifyContent: "center" }}>
            <button style={{
              height: 50, padding: "0 22px 0 26px",
              borderRadius: 999,
              background: "#A8243C",
              color: "#FFFFFF", border: "none",
              fontSize: 17, fontWeight: 600, letterSpacing: -0.2,
              display: "inline-flex", alignItems: "center", gap: 8,
              cursor: "pointer", fontFamily: "inherit",
            }}>
              <span>Start mission</span>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M2 7 H12 M8.2 3.2 L12 7 L8.2 10.8" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
              </svg>
            </button>
          </div>
        </div>

        <TabBar active="home" />
      </div>
    </IOSDevice>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Airlock />);
</script>
</body>
</html>

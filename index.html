<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airlock — The focus app built for creators.</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
    background: #F5F5F5;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    color: #1A1A1A;
  }

  .layout {
    display: flex;
    min-height: 100vh;
  }

  .col-left {
    width: 50%;
    display: flex;
    align-items: center;
    padding: 60px 80px;
  }

  .col-left-inner {
    max-width: 520px;
    width: 100%;
  }

  .app-name {
    font-size: 15px;
    font-weight: 600;
    color: #1A1A1A;
    letter-spacing: 0;
  }

  .headline {
    font-size: 52px;
    font-weight: 700;
    color: #1A1A1A;
    letter-spacing: -1px;
    line-height: 1.1;
    max-width: 480px;
    margin-top: 16px;
  }

  .subheadline {
    font-size: 18px;
    font-weight: 400;
    color: #6B6B6B;
    max-width: 420px;
    margin-top: 16px;
    line-height: 1.5;
  }

  .form-row {
    display: flex;
    gap: 8px;
    margin-top: 32px;
  }

  .email-input {
    flex: 1;
    height: 52px;
    background: #fff;
    border: 1px solid #D1D1D1;
    border-radius: 8px;
    padding: 0 16px;
    font-size: 15px;
    font-family: inherit;
    color: #1A1A1A;
    outline: none;
    transition: border-color 0.15s;
  }

  .email-input::placeholder {
    color: #AEAEB2;
  }

  .email-input:focus {
    border-color: #A8243C;
  }

  .submit-btn {
    height: 52px;
    background: #A8243C;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 24px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }

  .submit-btn:hover {
    background: #8f1e33;
  }

  .follow-link {
    display: block;
    margin-top: 16px;
    font-size: 14px;
    color: #6B6B6B;
    text-decoration: none;
  }

  .follow-link:hover {
    color: #1A1A1A;
  }

  .coming-soon {
    display: block;
    margin-top: 8px;
    font-size: 13px;
    color: #AEAEB2;
  }

  .col-right {
    width: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }

  .mockup-img {
    max-height: 680px;
    width: 100%;
    object-fit: contain;
  }

  @media (max-width: 768px) {
    .layout {
      flex-direction: column;
    }

    .col-left {
      width: 100%;
      padding: 48px 24px 32px;
    }

    .col-left-inner {
      max-width: 100%;
    }

    .headline {
      font-size: 36px;
    }

    .col-right {
      width: 100%;
      padding: 0 24px 48px;
      justify-content: center;
    }

    .mockup-img {
      max-height: 380px;
    }
  }
</style>
</head>
<body>

<div class="layout">
  <div class="col-left">
    <div class="col-left-inner">
      <span class="app-name">Airlock</span>

      <h1 class="headline">The focus app built for creators.</h1>

      <p class="subheadline">Open Instagram with a purpose. Set your mission, track your focus, and actually do what you came to do.</p>

      <form method="POST" action="https://formspree.io/f/xeerkroz">
        <input type="hidden" name="source" id="utm-source" value="">
        <div class="form-row">
          <input class="email-input" type="email" id="email" name="email" placeholder="Enter your email" required>
          <button type="submit" class="submit-btn">Join waitlist</button>
        </div>
      </form>

      <a class="follow-link" href="https://tiktok.com/@rajderangula_" target="_blank" rel="noopener noreferrer">Follow @rajderangula_ for updates ↗</a>
      <span class="coming-soon">iOS only · Coming June 2025</span>
    </div>
  </div>

  <div class="col-right">
    <img class="mockup-img" src="mockup.png" alt="Airlock app mockup">
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const source = params.get('utm_source') || 'direct';
document.getElementById('utm-source').value = source;
</script>
</body>
</html>

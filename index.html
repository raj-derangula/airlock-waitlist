<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airlock: The focus app built for creators.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
    background: #f2f5f6;
    font-family: 'Inter', sans-serif;
    color: #1A1A1A;
    overflow-x: hidden;
  }

  .layout {
    display: flex;
    min-height: 100vh;
    align-items: center;
    max-width: 1100px;
    margin: 0 auto;
    gap: 40px;
  }

  /* ── Left column ── */
  .col-left {
    flex: 1;
    padding: 72px 20px 72px clamp(32px, 6vw, 80px);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .app-name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #A8243C;
    margin-bottom: 32px;
    display: block;
  }

  .headline {
    font-size: clamp(38px, 5vw, 54px);
    font-weight: 800;
    color: #1A1A1A;
    letter-spacing: -2px;
    line-height: 1.05;
    margin-bottom: 20px;
  }

  .subheadline {
    font-size: 17px;
    font-weight: 400;
    color: #4A4A4A;
    max-width: 380px;
    line-height: 1.6;
    margin-bottom: 36px;
  }

  /* Form */
  .form-row {
    display: flex;
    gap: 8px;
    max-width: 460px;
  }

  .email-input {
    flex: 1;
    height: 52px;
    background: #fff;
    border: 1.5px solid #d4dadc;
    border-radius: 12px;
    padding: 0 18px;
    font-size: 15px;
    font-family: inherit;
    color: #1A1A1A;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .email-input::placeholder { color: #B0B0B8; }

  .email-input:focus {
    border-color: #A8243C;
    box-shadow: 0 0 0 3px rgba(168,36,60,0.08);
  }

  .submit-btn {
    height: 52px;
    background: #A8243C;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 0 26px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, transform 0.1s;
    box-shadow: 0 2px 8px rgba(168,36,60,0.30);
  }

  .submit-btn:hover { background: #8f1e33; }
  .submit-btn:active { transform: scale(0.98); }

  /* Feedback */
  #form-message {
    margin-top: 12px;
    font-size: 14px;
    min-height: 20px;
    color: #4A4A4A;
  }

  #form-message.success { color: #1a7a45; }
  #form-message.error   { color: #A8243C; }

  .follow-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 20px;
    font-size: 14px;
    color: #888888;
    text-decoration: none;
    transition: color 0.15s;
  }

  .follow-link:hover { color: #1A1A1A; }

  .coming-soon {
    display: block;
    margin-top: 8px;
    font-size: 13px;
    color: #AEAEB8;
  }

  /* ── Right column ── */
  .col-right {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px 48px 0;
  }

  .demo-video-wrap {
    width: 640px;
    max-width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 24px;
    flex-shrink: 0;
  }

  .demo-video-wrap video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ── Mobile ── */
  @media (max-width: 768px) {
    .layout {
      flex-direction: column;
      align-items: stretch;
      gap: 0;
    }

    .col-left {
      width: 100%;
      padding: 56px 28px 32px;
      justify-content: flex-start;
    }

    .headline {
      letter-spacing: -1.5px;
    }

    .form-row {
      max-width: 100%;
      flex-wrap: wrap;
    }

    .submit-btn {
      width: 100%;
    }

    .col-right {
      width: 100%;
      padding: 8px 0 56px;
      justify-content: center;
    }
  }
</style>
</head>
<body>

<div class="layout">

  <div class="col-left">

    <span class="app-name">Airlock</span>

    <h1 class="headline">The focus app<br>built for creators.</h1>

    <p class="subheadline">Open your socials with intention. Stay focused while you create.</p>

    <form id="waitlist-form" method="POST" action="https://formspree.io/f/xeerkroz">
      <input type="hidden" name="source" id="utm-source" value="">
      <div class="form-row">
        <input class="email-input" type="email" id="email" name="email" placeholder="Enter your email" required>
        <button type="submit" class="submit-btn">Join waitlist</button>
      </div>
    </form>
    <p id="form-message"></p>

    <a class="follow-link" href="https://www.linkedin.com/in/raj-derangula-0a2b62290/" target="_blank" rel="noopener noreferrer">
      Follow my journey on LinkedIn
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.5 10.5L10.5 2.5M10.5 2.5H5.5M10.5 2.5V7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <span class="coming-soon">iOS only · Coming June 2026</span>

  </div>

  <div class="col-right">
    <div class="demo-video-wrap">
      <video autoplay loop muted playsinline>
        <source src="airlock_demo.mp4" type="video/mp4">
      </video>
    </div>
  </div>

</div>

<script>
  // UTM tracking
  const params = new URLSearchParams(window.location.search);
  document.getElementById('utm-source').value = params.get('utm_source') || 'direct';

  // Async form submission
  const form = document.getElementById('waitlist-form');
  const msg  = document.getElementById('form-message');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    msg.className = '';
    const btn = form.querySelector('button');
    btn.disabled = true;
    btn.textContent = 'Joining…';

    try {
      const res = await fetch(form.action, {
        method: 'POST',
        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value, source: document.getElementById('utm-source').value }),
      });
      if (res.ok) {
        msg.textContent = "You're on the list! We'll be in touch.";
        msg.className = 'success';
        form.reset();
      } else {
        throw new Error();
      }
    } catch {
      msg.textContent = 'Something went wrong. Please try again.';
      msg.className = 'error';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Join waitlist';
    }
  });
</script>
</body>
</html>
